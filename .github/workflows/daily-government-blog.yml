name: Publish verified government blog

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-government-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate and publish one verified article
        id: publish
        run: npm run blog:government:generate
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_CONTENT_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Verify article, sitemap and RSS in production
        run: npm run blog:government:verify
        env:
          BLOG_SLUG: ${{ steps.publish.outputs.slug }}
          SITE_URL: https://www.devcalc.in
